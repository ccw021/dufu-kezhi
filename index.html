<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>杜甫《客至》草堂迎客記</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #2c3e50; overflow: hidden; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative; width: 100%; height: 100%; max-width: 1200px; margin: 0 auto; background: #9cd8a1;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }
        canvas { display: block; width: 100%; height: 100%; }
        
        /* 頂部古代竹簡風格任務欄 */
        #task-bar {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            background: #f4edd2; color: #5c3a21; padding: 12px 35px;
            border-radius: 10px; border: 3px dashed #8b4513; font-size: 24px; font-weight: bold;
            text-align: center; white-space: nowrap; z-index: 50; box-shadow: 0 6px 12px rgba(0,0,0,0.2);
            pointer-events: none; display: none;
        }

        /* 童趣風虛擬方向鍵 */
        #dpad {
            position: absolute; bottom: 30px; right: 30px;
            width: 180px; height: 180px; pointer-events: auto; display: none; z-index: 50;
        }
        .dbtn {
            position: absolute; width: 60px; height: 60px; background: rgba(255, 245, 218, 0.85);
            border-radius: 50%; font-size: 32px; display: flex; justify-content: center; align-items: center;
            user-select: none; border: 3px solid #8b4513; box-shadow: 0 6px 0 #6e350c;
            cursor: pointer; transition: 0.1s;
        }
        .dbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #6e350c; background: #fff; }
        #up { top: 0; left: 60px; } #down { bottom: 0; left: 60px; }
        #left { top: 60px; left: 0; } #right { top: 60px; right: 0; }

        /* 遊戲覆蓋層（羊皮紙文學風格） */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center; z-index: 100;
        }
        .hidden { display: none !important; }
        .panel {
            background: #faf4e1; color: #3e2723; padding: 45px; border-radius: 25px; max-width: 75%;
            border: 6px solid #8b4513; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            position: relative;
        }
        h1 { color: #a62b2b; font-size: 46px; margin-top: 0; font-family: 'Kaiti', '標楷體', serif; border-bottom: 3px double #8b4513; padding-bottom: 10px;}
        p { font-size: 26px; line-height: 1.6; }
        
        /* 故事/獨白對話框樣式 */
        .dialog-box {
            font-size: 28px; line-height: 1.7; text-align: left; min-height: 100px;
            padding: 10px; margin-bottom: 20px;
        }
        .poem-highlight {
            color: #d32f2f; font-size: 30px; font-weight: bold; display: block;
            margin: 15px 0; text-align: center; font-family: 'Kaiti', '標楷體', serif;
            background: #f2e6cb; padding: 10px; border-radius: 8px; border-left: 5px solid #d32f2f;
        }

        button {
            padding: 12px 45px; font-size: 24px; font-weight: bold; cursor: pointer;
            background: #d32f2f; color: white; border: none; border-radius: 30px;
            box-shadow: 0 6px 0 #9a1f1f; transition: 0.1s;
        }
        button:hover { background: #e53935; }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a1f1f; }

        .end-poem {
            font-family: 'Kaiti', '標楷體', serif; font-size: 28px; line-height: 1.8;
            color: #3e2723; background: #eedeb0; padding: 20px; border-radius: 15px; margin: 20px 0;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1200" height="800"></canvas>
    
    <div id="task-bar">🌸 當前準備：<span id="task-text"></span></div>

    <div id="dpad">
        <div class="dbtn" id="up">▲</div>
        <div class="dbtn" id="left">◀</div>
        <div class="dbtn" id="right">▶</div>
        <div class="dbtn" id="down">▼</div>
    </div>

    <div id="start-screen" class="overlay">
        <div class="panel">
            <h1>📜 杜甫《客至》情境體驗遊戲</h1>
            <p>「舍南舍北皆春水，但見群鷗日日來。」<br>杜甫獨自居住在偏僻的成都草堂，每天只有海鷗作伴。<br>直到今天，他收到了一封令人狂喜的來信...</p>
            <button onclick="startIntro()">聆聽春水群鷗</button>
        </div>
    </div>

    <div id="dialog-screen" class="overlay hidden">
        <div class="panel" style="width: 700px;">
            <div id="speaker-name" style="font-size: 22px; font-weight: bold; color: #795548; margin-bottom: 5px; text-align: left;">杜甫：</div>
            <div id="dialog-text" class="dialog-box"></div>
            <button id="dialog-btn" onclick="advanceScript()">點擊繼續 ➔</button>
        </div>
    </div>

    <div id="end-screen" class="overlay hidden">
        <div class="panel">
            <h1 style="color: #27ae60; border-color: #27ae60;">🎉 賓主盡歡，隔離同飲！</h1>
            <p>太棒了！你完美重現了那份真摯而狂喜的文人情誼！</p>
            <div class="end-poem">
                <b>《客至》—— 杜甫</b><br>
                舍南舍北皆春水，但見群鷗日日來。<br>
                花徑不曾緣客掃，蓬門今始為君開。<br>
                盤飧市遠無兼味，樽酒家貧只舊醅。<br>
                肯與鄰翁相對飲，隔離呼取盡餘杯。
            </div>
            <button onclick="location.reload()">重新返回草堂</button>
        </div>
    </div>
</div>

<script>
    // --- 安全穩定的聲音引擎 ---
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } 
            catch(e) { console.warn("Audio Context Failed", e); }
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if(type === 'pop') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if(type === 'happy') {
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(523.25, now); 
                osc.frequency.setValueAtTime(659.25, now + 0.1); 
                osc.frequency.setValueAtTime(783.99, now + 0.2); 
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(); osc.stop(now + 0.4);
            }
        } catch(e) {}
    }

    // --- 情感豐沛的劇本系統 ---
    let scriptIndex = 0;
    let currentScript = [];
    let scriptCallback = null;

    const introScript = [
        { name: "杜甫", text: "唉，住在這浣花溪畔，風景雖然優美，但實在太偏僻了。\n每天「舍南舍北皆春水，但見群鷗日日來」，除了海鷗，根本沒人來看我……" },
        { name: "飛鴿傳書", text: "（撲棱棱——信鴿飛來）\n『子美兄，聞君隱居草堂，今日特來登門拜訪。 —— 好友崔明府字』" },
        { name: "杜甫", text: "（大喜過望！）\n天啊！崔明府要來了！這可是貴客啊！不行不行，家裡太亂了，我得趕緊準備，好好招待他！" }
    ];

    const phase1Script = [
        { name: "杜甫", text: "哎呀！平時只有我自己，這院子裡的落花小徑我都從來沒為別人掃過。\n今天老朋友要來，我要把院子掃得乾乾淨淨！<br><span class='poem-highlight'>「花徑不曾緣客掃」</span>" },
        { name: "杜甫", text: "快！還要把一直緊閉的草堂大門打開，迎接我的好朋友！<br><span class='poem-highlight'>「蓬門今始為君開」</span>" }
    ];

    const phase2Script = [
        { name: "杜甫", text: "（看著桌上的食物，面露慚愧）\n抱歉，家中只有這些簡陋的酒菜了，這是我僅有最好的食物了，希望老朋友不要嫌棄。<br><span class='poem-highlight'>「盤飧市遠無兼味，樽酒家貧只舊醅。」</span>" }
    ];

    const phase3Script = [
        { name: "杜甫", text: "崔兄！快請坐！\n抱歉，家中貧寒，只有這些簡陋的舊酒和粗菜，希望你不要嫌棄。" },
        { name: "崔明府", text: "子美兄言重了！不會不會，能和知心好友相聚，酒菜一點都不重要！這草堂風景清幽，正是飲酒的好地方！" }
    ];

    const phase4Script = [
        { name: "杜甫", text: "對了！獨樂樂不如眾樂樂，不如把隔壁的老翁也叫來一起喝！" },
        { name: "杜甫", text: "（走到籬笆旁大喊）\n老鄰居！我家來貴客了，快帶上你的酒杯，一起過來暢飲吧！<br><span class='poem-highlight'>「肯與鄰翁相對飲，隔離呼取盡餘杯。」</span>" },
        { name: "鄰居老翁", text: "來了來了！好香的酒，多謝子美兄邀請！" },
        { name: "杜甫", text: "（舉杯大笑）哈哈哈！今天能與摯友和好鄰居同聚，真是我這段時間以來最歡喜的一天啊！乾杯！" }
    ];

    function startScript(scriptArray, callback) {
        currentScript = scriptArray;
        scriptIndex = 0;
        scriptCallback = callback;
        gameState = 'dialog';
        document.getElementById('dialog-screen').classList.remove('hidden');
        document.getElementById('dpad').style.display = 'none';
        advanceScript();
    }

    function advanceScript() {
        if (scriptIndex < currentScript.length) {
            let current = currentScript[scriptIndex];
            document.getElementById('speaker-name').innerText = current.name + "：";
            document.getElementById('dialog-text').innerHTML = current.text;
            playSound('pop');
            scriptIndex++;
        } else {
            // 對話結束，嚴格執行回調並關閉鎖
            document.getElementById('dialog-screen').classList.add('hidden');
            let cb = scriptCallback;
            scriptCallback = null; 
            if (cb) cb();
        }
    }

    // --- 遊戲引擎與防連環觸發系統 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameState = 'init'; 
    let phase = 0; 
    let animFrame = 0;
    let isTransitioning = false; // 🔒 防連環觸發的安全鎖！

    const keys = { ArrowUp:false, ArrowLeft:false, ArrowDown:false, ArrowRight:false, w:false, a:false, s:false, d:false };
    const player = { x: 600, y: 550, size: 25, speed: 6, emoji: '👳‍♂️', state: 'normal', jumpY: 0, showHearts: false };

    window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });
    
    // --- 環境物件設定 ---
    let env = {
        house: { x: 300, y: 100, w: 600, h: 180 },
        kitchen: { x: 320, y: 180, w: 100, h: 60 },
        broom: { x: 230, y: 400, active: true },
        gate: { x: 500, y: 730, w: 200, h: 70, open: false },
        table: { x: 600, y: 480, r: 55, hasFood: false },
        fence: { x: 1140, y: 350, w: 20, h: 450, show: true },
        petals: []
    };

    let cui = { x: 600, y: 880, active: false, emoji: '👨‍💼', jumpY: 0, showHearts: false };
    let neighbor = { x: 1250, y: 480, active: false, emoji: '👴', jumpY: 0, showHearts: false };

    // 浪漫落花
    for(let i=0; i<60; i++) {
        env.petals.push({
            x: 100 + Math.random() * 1000, y: 300 + Math.random() * 380,
            r: 4 + Math.random() * 4, color: Math.random() > 0.5 ? '#ffb6c1' : '#ffc0cb'
        });
    }

    // 動態海鷗
    let gulls = [
        {x: 200, y: 40, s: 1.5, angle: 0},
        {x: 500, y: 60, s: 1.2, angle: Math.PI},
        {x: 900, y: 30, s: 2.0, angle: Math.PI/2}
    ];

    // --- 核心繪圖系統 ---
    function drawMap() {
        let wave = Math.sin(animFrame * 0.05) * 5;
        ctx.fillStyle = '#4ea1a1'; ctx.fillRect(0, 0, canvas.width, 95); 
        ctx.fillStyle = '#71baba'; ctx.fillRect(0, 95 + wave, canvas.width, 15); 

        ctx.fillStyle = '#9cd8a1'; ctx.fillRect(0, 110, canvas.width, canvas.height - 110);
        ctx.fillStyle = '#e4ca9b';
        ctx.fillRect(550, 280, 100, 520); 
        ctx.fillRect(200, 430, 800, 90);  

        ctx.fillStyle = '#ffffff';
        gulls.forEach(g => {
            g.x += g.s; if(g.x > canvas.width + 50) g.x = -50;
            let wing = Math.sin(animFrame * 0.15 + g.angle) * 8;
            ctx.beginPath();
            ctx.moveTo(g.x, g.y);
            ctx.quadraticCurveTo(g.x - 10, g.y - 10 + wing, g.x - 20, g.y);
            ctx.moveTo(g.x, g.y);
            ctx.quadraticCurveTo(g.x + 10, g.y - 10 + wing, g.x + 20, g.y);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
        });

        if(env.fence.show) {
            ctx.fillStyle = '#8c6843';
            for(let y = env.fence.y; y < env.fence.y + env.fence.h; y += 30) ctx.fillRect(env.fence.x, y, 12, 25);
            ctx.fillRect(env.fence.x - 5, env.fence.y + 100, 22, 10);
            ctx.fillRect(env.fence.x - 5, env.fence.y + 300, 22, 10);
        }

        env.petals.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        });

        drawBloomingTree(120, 320); drawBloomingTree(130, 650);
        drawBloomingTree(1080, 300); drawBloomingTree(1060, 680);

        ctx.fillStyle = '#e6cda3'; ctx.fillRect(env.house.x, env.house.y, env.house.w, env.house.h); 
        ctx.fillStyle = '#a0522d'; ctx.fillRect(env.house.x - 20, env.house.y - 15, env.house.w + 40, 45); 
        
        ctx.fillStyle = '#7f8c8d'; ctx.fillRect(env.kitchen.x, env.kitchen.y, env.kitchen.w, env.kitchen.h);
        ctx.font = '36px Arial'; ctx.fillText('🍲', env.kitchen.x + 50, env.kitchen.y + 30);

        ctx.fillStyle = '#bdc3c7';
        ctx.beginPath(); ctx.arc(env.table.x, env.table.y, env.table.r, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#95a5a6'; ctx.lineWidth = 4; ctx.stroke();
        ctx.beginPath(); ctx.arc(env.table.x - 75, env.table.y, 16, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(env.table.x + 75, env.table.y, 16, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(env.table.x, env.table.y - 75, 16, 0, Math.PI*2); ctx.fill();

        if(env.table.hasFood) {
            ctx.font = '34px Arial';
            ctx.fillText('🍲', env.table.x - 18, env.table.y);
            ctx.fillText('🍶', env.table.x + 20, env.table.y);
        }

        ctx.fillStyle = '#5c3a21';
        if(!env.gate.open) {
            ctx.fillRect(env.gate.x, env.gate.y, env.gate.w, env.gate.h); 
            ctx.fillStyle = '#f1c40f'; ctx.font = '20px Arial';
            ctx.fillText('蓬門緊閉', env.gate.x + 100, env.gate.y + 35);
        } else {
            ctx.fillRect(env.gate.x, env.gate.y, 25, env.gate.h); 
            ctx.fillRect(env.gate.x + env.gate.w - 25, env.gate.y, 25, env.gate.h); 
        }

        if(env.broom.active) {
            ctx.font = '40px Arial'; ctx.fillText('🧹', env.broom.x, env.broom.y);
        }
    }

    function drawBloomingTree(x, y) {
        ctx.fillStyle = '#5c3a21'; ctx.fillRect(x - 8, y, 16, 60); 
        ctx.fillStyle = '#ff69b4'; ctx.beginPath(); ctx.arc(x, y - 25, 50, 0, Math.PI*2); ctx.fill(); 
        ctx.fillStyle = '#ffb6c1'; ctx.beginPath(); ctx.arc(x - 30, y - 10, 35, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(x + 30, y - 10, 35, 0, Math.PI*2); ctx.fill();
    }

    function drawSprite(c, isPlayer) {
        if(!c.active && !isPlayer) return;
        ctx.save();
        let targetY = c.y + c.jumpY;

        ctx.font = '55px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(c.emoji, c.x, targetY);

        if(isPlayer && player.state === 'holdingFood') {
            ctx.font = '30px Arial'; ctx.fillText('🍲', c.x + 25, targetY - 25);
        }

        if(c.showHearts && (animFrame % 10 < 6)) {
            ctx.font = '24px Arial';
            ctx.fillText('❤️', c.x - 30, targetY - 45);
            ctx.fillText('🎵', c.x + 35, targetY - 50);
            ctx.fillText('✨', c.x, targetY - 60);
        }
        ctx.restore();
    }

    function drawQuestMarker(x, y) {
        let pulse = Math.sin(animFrame * 0.15) * 8;
        ctx.fillStyle = `rgba(230, 126, 34, ${0.4 + Math.sin(animFrame*0.1)*0.2})`;
        ctx.beginPath(); ctx.arc(x, y, 45 + pulse, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 32px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('❓', x, y - 40 - pulse*0.5);
    }

    // --- 嚴謹的腳本啟動與遊戲流程 ---
    function startIntro() {
        initAudio(); // 確保音效引擎安全啟動
        document.getElementById('start-screen').classList.add('hidden');
        startScript(introScript, () => {
            phase = 1;
            document.getElementById('task-bar').style.display = 'block';
            document.getElementById('task-text').innerText = "找出「掃把」打掃，並打開下方「蓬門」。";
            document.getElementById('dpad').style.display = 'block';
            gameState = 'playing';
            triggerJoy(player);
        });
    }

    function triggerJoy(character) {
        character.showHearts = true;
        let jumpCount = 0;
        function jump() {
            if(jumpCount < 3) {
                character.jumpY = -25;
                setTimeout(() => { character.jumpY = 0; }, 150);
                jumpCount++;
                setTimeout(jump, 300);
            } else {
                character.showHearts = false;
            }
        }
        jump();
        playSound('happy');
    }

    function checkStageProgress() {
        if(gameState !== 'playing' || isTransitioning) return;
        let dx, dy, dist;

        // 1. 掃地與開蓬門
        if(phase === 1) {
            if(env.broom.active) {
                dx = player.x - env.broom.x; dy = player.y - env.broom.y;
                if(Math.sqrt(dx*dx + dy*dy) < 55) {
                    env.broom.active = false; env.petals = []; 
                    playSound('pop');
                }
            }
            if(!env.broom.active && !env.gate.open) {
                if(player.x > env.gate.x && player.x < env.gate.x + env.gate.w && player.y > env.gate.y - 55) {
                    isTransitioning = true; // 上鎖！防止多重觸發
                    env.gate.open = true;
                    player.emoji = '😄'; 
                    startScript(phase1Script, () => {
                        phase = 2;
                        document.getElementById('task-text').innerText = "到左側「廚房」準備酒菜放桌上。";
                        isTransitioning = false; // 開鎖
                        gameState = 'playing';
                        document.getElementById('dpad').style.display = 'block';
                    });
                }
            }
        }

        // 2. 取酒菜放石桌
        if(phase === 2) {
            if(player.state === 'normal') {
                if(player.x > env.kitchen.x && player.x < env.kitchen.x + env.kitchen.w && player.y < env.kitchen.y + env.kitchen.h + 35) {
                    player.state = 'holdingFood'; playSound('pop');
                }
            }
            if(player.state === 'holdingFood') {
                dx = player.x - env.table.x; dy = player.y - env.table.y;
                if(Math.sqrt(dx*dx + dy*dy) < 75) {
                    isTransitioning = true;
                    env.table.hasFood = true; player.state = 'normal';
                    player.emoji = '😋';
                    startScript(phase2Script, () => {
                        phase = 3;
                        document.getElementById('task-text').innerText = "走到門口迎接好友「崔明府」入座。";
                        cui.active = true; cui.x = 600; cui.y = 760; 
                        isTransitioning = false;
                        gameState = 'playing';
                        document.getElementById('dpad').style.display = 'block';
                    });
                }
            }
        }

        // 3. 迎接崔明府
        if(phase === 3) {
            dx = player.x - cui.x; dy = player.y - cui.y;
            if(Math.sqrt(dx*dx + dy*dy) < 65) {
                isTransitioning = true;
                triggerJoy(player); triggerJoy(cui);
                player.emoji = '😆';
                
                cui.x = env.table.x - 75; cui.y = env.table.y;
                player.x = env.table.x + 75; player.y = env.table.y;
                
                startScript(phase3Script, () => {
                    phase = 4;
                    document.getElementById('task-text').innerText = "走到右側「籬笆」呼叫鄰居共飲。";
                    isTransitioning = false;
                    gameState = 'playing';
                    document.getElementById('dpad').style.display = 'block';
                });
            }
        }

        // 4. 呼喚鄰居共飲
        if(phase === 4) {
            if(player.x > env.fence.x - 65) {
                isTransitioning = true;
                env.fence.show = false; 
                neighbor.active = true;
                neighbor.x = env.table.x; neighbor.y = env.table.y - 75; 
                player.x = env.table.x + 75; player.y = env.table.y; 
                
                triggerJoy(player); triggerJoy(neighbor); triggerJoy(cui);
                
                startScript(phase4Script, () => {
                    gameState = 'end';
                    document.getElementById('task-bar').style.display = 'none';
                    document.getElementById('dpad').style.display = 'none';
                    document.getElementById('end-screen').classList.remove('hidden');
                });
            }
        }
    }

    function gameLoop() {
        animFrame++;
        
        if(gameState === 'playing' && !isTransitioning) {
            let nx = player.x, ny = player.y;
            if(keys.ArrowUp || keys.w) ny -= player.speed;
            if(keys.ArrowDown || keys.s) ny += player.speed;
            if(keys.ArrowLeft || keys.a) nx -= player.speed;
            if(keys.ArrowRight || keys.d) nx += player.speed;

            nx = Math.max(30, Math.min(1170, nx));
            ny = Math.max(120, Math.min(770, ny));
            
            if(!(nx > env.house.x - 20 && nx < env.house.x + env.house.w + 20 && ny < env.house.y + env.house.h + 10)) {
                player.x = nx; player.y = ny;
            }
            checkStageProgress();
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawMap();
        
        if(gameState === 'playing') {
            if(phase === 1 && env.broom.active) drawQuestMarker(env.broom.x, env.broom.y);
            else if(phase === 1 && !env.broom.active && !env.gate.open) drawQuestMarker(env.gate.x + 100, env.gate.y + 20);
            else if(phase === 2 && player.state === 'normal') drawQuestMarker(env.kitchen.x + 50, env.kitchen.y + 30);
            else if(phase === 2 && player.state === 'holdingFood') drawQuestMarker(env.table.x, env.table.y);
            else if(phase === 3) drawQuestMarker(cui.x, cui.y);
            else if(phase === 4) drawQuestMarker(env.fence.x - 30, 500);
        }

        drawSprite(player, true);
        drawSprite(cui, false);
        drawSprite(neighbor, false);

        requestAnimationFrame(gameLoop);
    }

    drawMap(); drawSprite(player, true);
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
